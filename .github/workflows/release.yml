# Builds the app for Windows, macOS and Linux and publishes them as one GitHub
# release, which is also the auto-update feed. Start it by pushing a tag that
# matches package.json:  git tag v1.0.0 && git push origin v1.0.0
#
# Windows is signed through SignPath Foundation once its settings exist (see
# .signpath/README.md); until then the installer is unsigned and Windows
# shows a SmartScreen warning. macOS builds are unsigned: users open the app
# once from System Settings > Privacy & Security, and it cannot update itself.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Version
        shell: bash
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [ "$GITHUB_REF_NAME" = "v$APP_VERSION" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json (v$APP_VERSION)"; exit 1; }

      # ── Windows ─────────────────────────────────────────────────────────
      # Without SignPath settings: an unsigned installer, published as it is.
      - name: Windows, unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::No SignPath settings: the Windows installer is unsigned."
          npx electron-builder --win nsis --publish always

      # With SignPath (see .signpath/README.md): sign the app, build the
      # installer around the signed app, sign the installer, then write the
      # update metadata for the signed file and publish it.
      # An installer build (not --dir): only it writes resources/app-update.yml,
      # without which an installed copy cannot find its updates.
      - name: Windows app, unpacked
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        run: npx electron-builder --win nsis --publish never
      - name: Upload the app for signing
        id: unsigned-app
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: dist/win-unpacked
      - name: Sign the app
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/win-unpacked-signed
          parameters: |
            version: ${{ toJSON(env.APP_VERSION) }}
      - name: Installer around the signed app
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          rm -rf dist/win-unpacked
          mv dist/win-unpacked-signed dist/win-unpacked
          test -f dist/win-unpacked/resources/app-update.yml
          npx electron-builder --win nsis --prepackaged dist/win-unpacked --publish never
      - name: Upload the installer for signing
        id: unsigned-installer
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/CodingFleet-Setup-${{ env.APP_VERSION }}.exe
      - name: Sign the installer
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed
          parameters: |
            version: ${{ toJSON(env.APP_VERSION) }}
      - name: Publish the signed installer
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="CodingFleet-Setup-${APP_VERSION}.exe"
          mv "dist/signed/$file" "dist/$file"
          # Signing changed the file: its checksum and blockmap are written again.
          node scripts/installer-metadata.cjs "dist/$file"
          tag="v${APP_VERSION}"
          # The macOS and Linux jobs publish into the same release; whichever
          # job is first creates it.
          for attempt in 1 2 3; do
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "CodingFleet $APP_VERSION" || true
            gh release upload "$tag" "dist/$file" "dist/$file.blockmap" dist/latest.yml --clobber && break
            sleep 10
          done

      - name: macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A "Developer ID Application" certificate, exported as .p12, base64.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--mac dmg zip --x64 --arm64 --publish always)
          if [ -z "$CSC_LINK" ]; then
            # A secret that is not set arrives as an empty string, and
            # electron-builder reads CSC_LINK="" as a certificate path (the
            # project folder: "not a file"). Unset, it looks for none.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            # Ad-hoc signed ("-"): no Apple certificate, but Apple silicon runs
            # only signed code, and an unsigned app there is reported "damaged".
            args+=(-c.mac.identity=-)
            echo "::warning::No Apple certificate: the macOS app is ad-hoc signed and cannot update itself."
          elif [ -n "$APPLE_ID" ]; then
            args+=(-c.mac.notarize=true)
          fi
          npx electron-builder "${args[@]}"

      - name: Linux
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage deb --publish always
