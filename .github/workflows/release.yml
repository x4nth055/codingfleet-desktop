# Builds the app for Windows, macOS and Linux and publishes them as one GitHub
# release, which is also the auto-update feed. Start it by pushing a tag that
# matches package.json:  git tag v1.0.0 && git push origin v1.0.0
#
# Signing is switched on by the repository's settings, not by this file:
#
#   Windows  Azure Artifact Signing (formerly Trusted Signing).
#            Variables: AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#                       AZURE_SIGNING_PROFILE, AZURE_SIGNING_PUBLISHER
#            Secrets:   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#   macOS    An Apple "Developer ID Application" certificate, and notarization.
#            Secrets:   MAC_CERTIFICATE_P12, MAC_CERTIFICATE_PASSWORD,
#                       APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#
# Without them the Windows installer is unsigned (a SmartScreen warning) and
# the macOS app is ad-hoc signed: users open it once from System Settings >
# Privacy & Security, and it cannot update itself.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Version
        shell: bash
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [ "$GITHUB_REF_NAME" = "v$APP_VERSION" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json (v$APP_VERSION)"; exit 1; }

      # electron-builder signs the app, the uninstaller and the installer while
      # it builds, so latest.yml and the blockmap describe the signed installer.
      - name: Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The app registration that may sign with the certificate profile.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # The region's endpoint, e.g. https://eus.codesigning.azure.net
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          # The certificate's subject name (CN), exactly: an installed copy
          # accepts an update only when it is signed by this name.
          SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          args=(--win nsis --publish always)
          if [ -z "$SIGNING_ACCOUNT" ]; then
            unset AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET
            echo "::warning::No Azure signing settings: the Windows installer is unsigned."
          else
            for name in SIGNING_ENDPOINT SIGNING_PROFILE SIGNING_PUBLISHER AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
              [ -n "${!name}" ] || { echo "::error::Windows signing is on (AZURE_SIGNING_ACCOUNT is set) but ${name#SIGNING_} is missing."; exit 1; }
            done
            args+=(
              "-c.win.azureSignOptions.endpoint=$SIGNING_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$SIGNING_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$SIGNING_PROFILE"
              "-c.win.azureSignOptions.publisherName=$SIGNING_PUBLISHER"
            )
          fi
          npx electron-builder "${args[@]}"

      - name: macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A "Developer ID Application" certificate, exported as .p12, base64.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(--mac dmg zip --x64 --arm64 --publish always)
          if [ -z "$CSC_LINK" ]; then
            # A secret that is not set arrives as an empty string, and
            # electron-builder reads CSC_LINK="" as a certificate path (the
            # project folder: "not a file"). Unset, it looks for none.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            # Ad-hoc signed ("-"): no Apple certificate, but Apple silicon runs
            # only signed code, and an unsigned app there is reported "damaged".
            args+=(-c.mac.identity=-)
            echo "::warning::No Apple certificate: the macOS app is ad-hoc signed and cannot update itself."
          else
            # macOS installs an update only when the same developer signed it,
            # so only a build signed here may update itself: the mark lands in
            # the packaged package.json, where src/main/updater.js reads it.
            args+=(-c.extraMetadata.macSigned=true)
            if [ -n "$APPLE_ID" ]; then
              args+=(-c.mac.notarize=true)
            else
              echo "::warning::No Apple ID: the macOS app is signed but not notarized, so Gatekeeper still warns."
            fi
          fi
          npx electron-builder "${args[@]}"

      - name: Linux
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage deb --publish always
